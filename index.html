  <script>
    // Apply the saved or system theme before first paint.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('mockexam:v1:theme')); } catch (e) { }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

<body>

  <header class="hdr" id="hdr">

  <div class="bg-fx" aria-hidden="true"><span></span><span></span></div>

          <line x1="5" y1="21" x2="27" y2="11" />
        </g>
      </svg>
      <span class="loading-text">Loading question banks</span>
    </div>
    <noscript>
      <p class="notice notice-error">This site needs JavaScript to run the practice exams.</p>
    </noscript>
